<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Illustration of the Python Daily panel: a header with tabs and five digest cards">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8bbe"/>
      <stop offset="1" stop-color="#2f6690"/>
    </linearGradient>
  </defs>

  <!-- outer panel -->
  <rect x="16" y="16" width="608" height="268" rx="18" fill="none" stroke="#8a97a8" stroke-opacity="0.55" stroke-width="2"/>

  <!-- header: icon, title bars, action button -->
  <circle cx="52" cy="52" r="14" fill="url(#accent)" fill-opacity="0.85"/>
  <path d="M46 52l4.5 4.5L59 47" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="78" y="42" width="96" height="8" rx="4" fill="#8a97a8" fill-opacity="0.55"/>
  <rect x="78" y="56" width="150" height="6" rx="3" fill="#8a97a8" fill-opacity="0.35"/>
  <rect x="520" y="40" width="80" height="24" rx="12" fill="url(#accent)" fill-opacity="0.85"/>

  <!-- tab pills -->
  <rect x="40" y="78" width="66" height="20" rx="10" fill="url(#accent)" fill-opacity="0.75"/>
  <rect x="116" y="78" width="58" height="20" rx="10" fill="none" stroke="#8a97a8" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="184" y="78" width="58" height="20" rx="10" fill="none" stroke="#8a97a8" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="430" y="80" width="88" height="6" rx="3" fill="#8a97a8" fill-opacity="0.35"/>
  <rect x="530" y="80" width="70" height="6" rx="3" fill="#8a97a8" fill-opacity="0.25"/>

  <!-- big card: official blog -->
  <rect x="40" y="112" width="270" height="150" rx="14" fill="#8a97a8" fill-opacity="0.08" stroke="#8a97a8" stroke-opacity="0.35"/>
  <circle cx="64" cy="136" r="6" fill="#4b8bbe"/>
  <rect x="80" y="130" width="112" height="9" rx="4.5" fill="#8a97a8" fill-opacity="0.55"/>
  <rect x="60" y="156" width="228" height="7" rx="3.5" fill="#8a97a8" fill-opacity="0.45"/>
  <rect x="60" y="171" width="196" height="7" rx="3.5" fill="#8a97a8" fill-opacity="0.35"/>
  <rect x="60" y="194" width="228" height="7" rx="3.5" fill="#8a97a8" fill-opacity="0.45"/>
  <rect x="60" y="209" width="164" height="7" rx="3.5" fill="#8a97a8" fill-opacity="0.35"/>
  <rect x="60" y="232" width="72" height="16" rx="8" fill="#4b8bbe" fill-opacity="0.22"/>

  <!-- right column: four small cards -->
  <rect x="330" y="112" width="270" height="66" rx="14" fill="#8a97a8" fill-opacity="0.08" stroke="#8a97a8" stroke-opacity="0.35"/>
  <circle cx="354" cy="134" r="5" fill="#22c55e"/>
  <rect x="368" y="129" width="86" height="8" rx="4" fill="#8a97a8" fill-opacity="0.55"/>
  <rect x="350" y="150" width="180" height="6" rx="3" fill="#8a97a8" fill-opacity="0.4"/>
  <rect x="546" y="126" width="38" height="14" rx="7" fill="#22c55e" fill-opacity="0.22"/>

  <rect x="330" y="188" width="130" height="74" rx="14" fill="#8a97a8" fill-opacity="0.08" stroke="#8a97a8" stroke-opacity="0.35"/>
  <circle cx="352" cy="208" r="5" fill="#a855f7"/>
  <rect x="364" y="204" width="62" height="8" rx="4" fill="#8a97a8" fill-opacity="0.55"/>
  <rect x="348" y="224" width="86" height="6" rx="3" fill="#8a97a8" fill-opacity="0.4"/>
  <rect x="348" y="238" width="60" height="6" rx="3" fill="#8a97a8" fill-opacity="0.3"/>

  <rect x="470" y="188" width="130" height="74" rx="14" fill="#8a97a8" fill-opacity="0.08" stroke="#8a97a8" stroke-opacity="0.35"/>
  <circle cx="492" cy="208" r="5" fill="#eab308"/>
  <rect x="504" y="204" width="70" height="8" rx="4" fill="#8a97a8" fill-opacity="0.55"/>
  <rect x="488" y="224" width="88" height="6" rx="3" fill="#8a97a8" fill-opacity="0.4"/>
  <rect x="488" y="238" width="52" height="6" rx="3" fill="#8a97a8" fill-opacity="0.3"/>

  <!-- footer hint -->
  <rect x="40" y="272" width="130" height="6" rx="3" fill="#8a97a8" fill-opacity="0.25"/>
</svg>
